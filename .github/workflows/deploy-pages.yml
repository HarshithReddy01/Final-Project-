name: Deploy client to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - client/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run typecheck -w client

      - run: npm run lint -w client

      - run: npm run test -w client

      - run: npm run build -w client -- --base=/Final-Project-/
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://vitrine-api-t15u.onrender.com' }}

      - run: cp client/dist/index.html client/dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
